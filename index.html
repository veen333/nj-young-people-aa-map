<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
>

<title>NJ Young People AA</title>

<meta name="theme-color" content="#123d63">

<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

<style>

html,
body {
  margin: 0;
  padding: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  color: #183047;
  background: #f5f8fb;
}

* {
  box-sizing: border-box;
}

/* ==========================================================
   APP
   ========================================================== */

#app {
  height: 100dvh;
  width: 100%;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ==========================================================
   HEADER
   ========================================================== */

header {
  flex: 0 0 auto;
  padding:
    calc(13px + env(safe-area-inset-top))
    15px
    12px;
  background: #123d63;
  color: white;
}

header h1 {
  margin: 0 0 3px;
  font-size: 21px;
  line-height: 1.2;
}

header p {
  margin: 0;
  font-size: 12px;
  line-height: 1.35;
  opacity: .9;
}

/* ==========================================================
   CONTROLS
   ========================================================== */

.controls {
  flex: 0 0 auto;
  display: flex;
  gap: 8px;
  padding: 10px;
  background: white;
  border-bottom: 1px solid #dce5ec;
}

.controls input,
.controls select {
  appearance: none;
  -webkit-appearance: none;

  height: 44px;
  min-width: 0;

  padding: 0 12px;

  border: 1px solid #c5d3df;
  border-radius: 10px;

  background: #fff;
  color: #183047;

  font: inherit;
  font-size: 16px;
}

.controls input {
  flex: 1 1 auto;
}

.controls select {
  flex: 0 0 120px;

  background-image:
    linear-gradient(45deg, transparent 50%, #183047 50%),
    linear-gradient(135deg, #183047 50%, transparent 50%);

  background-position:
    calc(100% - 17px) 18px,
    calc(100% - 12px) 18px;

  background-size:
    5px 5px,
    5px 5px;

  background-repeat: no-repeat;

  padding-right: 30px;
}

/* ==========================================================
   STATUS
   ========================================================== */

#status {
  flex: 0 0 auto;

  min-height: 35px;

  display: flex;
  align-items: center;

  padding: 8px 12px;

  background: #edf4f9;

  border-bottom: 1px solid #d8e4ed;

  font-size: 12px;
  line-height: 1.25;
}

/* ==========================================================
   MAP
   ========================================================== */

#map {
  position: relative;

  flex: 1 1 auto;

  width: 100%;
  min-height: 0;

  background: #dce8ef;
}

/*
Leaflet needs these dimensions to remain untouched.
*/

.leaflet-container {
  width: 100%;
  height: 100%;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

/* ==========================================================
   PINS
   ========================================================== */

.meeting-pin {
  width: 34px;
  height: 34px;

  display: flex;
  align-items: center;
  justify-content: center;

  border: 3px solid white;
  border-radius: 50%;

  background: #1265a4;
  color: white;

  font-size: 13px;
  font-weight: 800;

  box-shadow:
    0 2px 7px rgba(0, 0, 0, .35);
}

/* ==========================================================
   POPUPS
   ========================================================== */

.leaflet-popup-content-wrapper {
  border-radius: 12px;
}

.leaflet-popup-content {
  width: 245px !important;
  max-width: 75vw;

  max-height: 55vh;
  overflow-y: auto;

  margin: 13px 15px;
}

.popup-location {
  margin: 0 0 4px;

  font-size: 16px;
  font-weight: 750;
}

.popup-address {
  margin: 0 0 10px;

  font-size: 12px;
  line-height: 1.35;

  color: #516474;
}

.meeting {
  padding: 9px 0;

  border-top: 1px solid #dbe3ea;
}

.meeting:first-of-type {
  border-top: 0;
}

.meeting-name {
  display: block;

  margin-bottom: 3px;

  font-size: 15px;
  font-weight: 750;
}

.meeting-time {
  display: block;

  font-size: 13px;
}

.meeting-detail {
  display: block;

  margin-top: 3px;

  color: #607284;

  font-size: 11px;
  line-height: 1.3;
}

.directions {
  display: block;

  margin-top: 10px;
  padding: 11px;

  border-radius: 9px;

  background: #1265a4;
  color: white !important;

  text-align: center;
  text-decoration: none;

  font-weight: 750;
}

/* ==========================================================
   LEAFLET CONTROLS
   ========================================================== */

.leaflet-control-zoom a {
  color: #123d63;
}

.leaflet-control-attribution {
  font-size: 9px;
}

/* ==========================================================
   MOBILE
   ========================================================== */

@media (max-width: 390px) {

  header h1 {
    font-size: 19px;
  }

  .controls select {
    flex-basis: 105px;
  }

}

</style>
</head>

<body>

<div id="app">

<header>

  <h1>NJ Young People AA</h1>

  <p>
    Find Young People meetings across New Jersey
  </p>

</header>


<div class="controls">

  <input
    id="search"
    type="search"
    placeholder="Search name or town"
    aria-label="Search by meeting name or town"
    autocomplete="off"
  >

  <select
    id="day"
    aria-label="Filter by day"
  >

    <option value="">All days</option>

    <option>Sunday</option>
    <option>Monday</option>
    <option>Tuesday</option>
    <option>Wednesday</option>
    <option>Thursday</option>
    <option>Friday</option>
    <option>Saturday</option>

  </select>

</div>


<div
  id="status"
  role="status"
>
  Loading meetings…
</div>


<div
  id="map"
  aria-label="Map of Young People AA meetings"
></div>

</div>


<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
></script>


<script>

"use strict";

/* ==========================================================
   SETTINGS
   ========================================================== */

const NJ_CENTER = [
  40.0583,
  -74.4057
];

const NJ_ZOOM = 8;


/* ==========================================================
   STATE
   ========================================================== */

let meetings = [];

let updatedAt = null;

let map = null;

let meetingLayer = null;


/* ==========================================================
   HELPERS
   ========================================================== */

function validCoordinates(meeting) {

  const lat = Number(meeting.lat);
  const lon = Number(meeting.lon);

  return (
    Number.isFinite(lat) &&
    Number.isFinite(lon) &&
    lat >= 38.7 &&
    lat <= 41.5 &&
    lon >= -75.8 &&
    lon <= -73.7
  );

}


function createElement(
  tag,
  className,
  content
) {

  const element =
    document.createElement(tag);

  if (className) {
    element.className =
      className;
  }

  if (content !== undefined) {
    element.textContent =
      String(content);
  }

  return element;

}


/* ==========================================================
   MAP
   ========================================================== */

function initializeMap() {

  map = L.map(
    "map",
    {
      zoomControl: true,
      attributionControl: true
    }
  );

  L.tileLayer(
    "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
      minZoom: 6,
      maxZoom: 19,

      attribution:
        "© OpenStreetMap contributors"
    }
  ).addTo(map);

  meetingLayer =
    L.layerGroup()
      .addTo(map);

  map.setView(
    NJ_CENTER,
    NJ_ZOOM
  );

  /*
  iPhone Safari can calculate Leaflet's container size
  before the flex layout has finished.

  Force Leaflet to recalculate after the browser completes
  the first layout.
  */

  requestAnimationFrame(
    function () {

      requestAnimationFrame(
        function () {

          map.invalidateSize(
            true
          );

        }
      );

    }
  );

}


/* ==========================================================
   FILTER
   ========================================================== */

function filteredMeetings() {

  const search =
    document
      .getElementById("search")
      .value
      .trim()
      .toLowerCase();

  const day =
    document
      .getElementById("day")
      .value;

  return meetings.filter(
    function (meeting) {

      if (
        day &&
        meeting.day !== day
      ) {
        return false;
      }

      if (!search) {
        return true;
      }

      const searchable = [
        meeting.name,
        meeting.town,
        meeting.location,
        meeting.address,
        meeting.types
      ]
        .join(" ")
        .toLowerCase();

      return searchable.includes(
        search
      );

    }
  );

}


/* ==========================================================
   GROUP MEETINGS AT SAME LOCATION
   ========================================================== */

function groupMeetings(
  list
) {

  const groups =
    new Map();

  for (const meeting of list) {

    if (
      !validCoordinates(
        meeting
      )
    ) {
      continue;
    }

    /*
    Group primarily by coordinates.

    This is more reliable than grouping by the text
    version of the address.
    */

    const lat =
      Number(meeting.lat);

    const lon =
      Number(meeting.lon);

    const key =
      lat.toFixed(5)
      + ","
      + lon.toFixed(5);

    if (
      !groups.has(key)
    ) {

      groups.set(
        key,
        []
      );

    }

    groups
      .get(key)
      .push(meeting);

  }

  return groups;

}


/* ==========================================================
   POPUP
   ========================================================== */

function buildPopup(
  group
) {

  const first =
    group[0];

  const popup =
    createElement("div");

  popup.appendChild(
    createElement(
      "div",
      "popup-location",
      first.location ||
      first.town ||
      first.name
    )
  );

  popup.appendChild(
    createElement(
      "div",
      "popup-address",
      first.address || ""
    )
  );


  for (
    const meeting
    of group
  ) {

    const item =
      createElement(
        "div",
        "meeting"
      );

    item.appendChild(
      createElement(
        "span",
        "meeting-name",
        meeting.name
      )
    );

    item.appendChild(
      createElement(
        "span",
        "meeting-time",
        meeting.day
        + " · "
        + meeting.time
      )
    );

    if (
      meeting.types
    ) {

      item.appendChild(
        createElement(
          "span",
          "meeting-detail",
          meeting.types
        )
      );

    }

    item.appendChild(
      createElement(
        "span",
        "meeting-detail",
        meeting.source
      )
    );

    popup.appendChild(
      item
    );

  }


  const directions =
    createElement(
      "a",
      "directions",
      "Directions in Apple Maps"
    );

  directions.href =
    "https://maps.apple.com/?daddr="
    + encodeURIComponent(
        first.address || (
          first.lat
          + ","
          + first.lon
        )
      );

  directions.target =
    "_blank";

  directions.rel =
    "noopener noreferrer";

  popup.appendChild(
    directions
  );


  return popup;

}


/* ==========================================================
   DRAW MAP
   ========================================================== */

function refreshMap() {

  if (
    !map ||
    !meetingLayer
  ) {
    return;
  }

  meetingLayer.clearLayers();


  const filtered =
    filteredMeetings();


  const groups =
    groupMeetings(
      filtered
    );


  const bounds = [];


  for (
    const group
    of groups.values()
  ) {

    const first =
      group[0];

    const lat =
      Number(first.lat);

    const lon =
      Number(first.lon);


    bounds.push(
      [
        lat,
        lon
      ]
    );


    const icon =
      L.divIcon(
        {
          className:
            "meeting-marker",

          html:
            '<div class="meeting-pin">'
            + group.length
            + "</div>",

          iconSize:
            [34, 34],

          iconAnchor:
            [17, 17],

          popupAnchor:
            [0, -16]
        }
      );


    const marker =
      L.marker(
        [
          lat,
          lon
        ],
        {
          icon: icon
        }
      );


    marker.bindPopup(
      buildPopup(
        group
      ),
      {
        maxWidth: 280,
        autoPanPadding:
          [25, 25]
      }
    );


    marker.addTo(
      meetingLayer
    );

  }


  /* ========================================================
     STATUS
     ======================================================== */

  const mappedMeetings =
    filtered.filter(
      validCoordinates
    ).length;


  let updatedText =
    "Not available";


  if (
    updatedAt
  ) {

    const date =
      new Date(
        updatedAt
      );

    updatedText =
      date.toLocaleString();

  }


  document
    .getElementById("status")
    .textContent =
      filtered.length
      + " meetings · "
      + mappedMeetings
      + " mapped · Updated "
      + updatedText;


  /* ========================================================
     ZOOM
     ======================================================== */

  if (
    bounds.length > 1
  ) {

    map.fitBounds(
      bounds,
      {
        paddingTopLeft:
          [35, 35],

        paddingBottomRight:
          [35, 35],

        maxZoom: 11,

        animate: false
      }
    );

  }

  else if (
    bounds.length === 1
  ) {

    map.setView(
      bounds[0],
      13,
      {
        animate: false
      }
    );

  }

  else {

    map.setView(
      NJ_CENTER,
      NJ_ZOOM,
      {
        animate: false
      }
    );

  }


  /*
  Recalculate once more after markers and bounds
  have changed.
  */

  setTimeout(
    function () {

      map.invalidateSize(
        false
      );

    },
    50
  );

}


/* ==========================================================
   LOAD DATA
   ========================================================== */

async function loadMeetings() {

  try {

    const response =
      await fetch(
        "./meetings.json?v="
        + Date.now(),
        {
          cache: "no-store"
        }
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "HTTP "
        + response.status
      );

    }


    const data =
      await response.json();


    if (
      !Array.isArray(
        data.meetings
      )
    ) {

      throw new Error(
        "Invalid meeting data"
      );

    }


    meetings =
      data.meetings;


    updatedAt =
      data.updated_at;


    refreshMap();

  }

  catch (
    error
  ) {

    document
      .getElementById("status")
      .textContent =
        "Could not load meeting data: "
        + error.message;

  }

}


/* ==========================================================
   EVENTS
   ========================================================== */

document
  .getElementById("search")
  .addEventListener(
    "input",
    refreshMap
  );


document
  .getElementById("day")
  .addEventListener(
    "change",
    refreshMap
  );


window.addEventListener(
  "resize",
  function () {

    if (!map) {
      return;
    }

    setTimeout(
      function () {

        map.invalidateSize(
          false
        );

      },
      100
    );

  }
);


/*
Safari changes the visible viewport when its address bar
expands/collapses.

Recalculate Leaflet when that happens too.
*/

if (
  window.visualViewport
) {

  window.visualViewport
    .addEventListener(
      "resize",
      function () {

        if (!map) {
          return;
        }

        setTimeout(
          function () {

            map.invalidateSize(
              false
            );

          },
          100
        );

      }
    );

}


/* ==========================================================
   START
   ========================================================== */

window.addEventListener(
  "load",
  function () {

    initializeMap();

    loadMeetings();

  }
);

</script>

</body>
</html>

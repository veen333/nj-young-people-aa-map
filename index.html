<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NJ Young People AA</title><meta name="theme-color" content="#123d63">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoak8jL0uQ4Hf4=" crossorigin="">
<style>
*{box-sizing:border-box}body{margin:0;font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#183047;background:#f5f8fb}header{padding:14px 16px;background:#123d63;color:#fff}h1{font-size:19px;margin:0 0 4px}header p{margin:0;font-size:12px;opacity:.9}.controls{display:flex;gap:8px;padding:10px;background:white}input,select{min-width:0;padding:11px;border:1px solid #c5d3df;border-radius:9px;font:inherit}input{flex:1}select{width:125px}#map{height:calc(100dvh - 176px);min-height:340px}.status{padding:9px 13px;font-size:12px;background:#edf4f9}.pin{background:#1265a4;color:white;border:2px solid white;border-radius:22px;width:36px;height:36px;display:grid;place-items:center;font-weight:700;box-shadow:0 2px 7px #0005}.meeting{border-top:1px solid #dbe3ea;padding:9px 0}.meeting strong{display:block;font-size:15px}.meeting small{display:block;margin-top:4px;color:#516474}.directions{display:block;margin-top:10px;padding:10px;background:#1265a4;color:white!important;text-decoration:none;text-align:center;border-radius:8px;font-weight:700}.leaflet-popup-content{max-height:55vh;overflow:auto;min-width:215px}details{padding:9px 13px;background:#fff;font-size:12px}details summary{cursor:pointer;font-weight:600}#unmapped{max-height:130px;overflow:auto}#unmapped p{margin:7px 0}a{color:#1265a4}@media(max-width:390px){select{width:105px}h1{font-size:17px}}
</style></head><body>
<header><h1>NJ Young People AA</h1><p>Find meetings across New Jersey · Confirm details with the listing before traveling</p></header>
<div class="controls"><input id="search" type="search" aria-label="Search meetings or towns" placeholder="Search name or town"><select id="day" aria-label="Filter by day"><option value="">All days</option><option>Sunday</option><option>Monday</option><option>Tuesday</option><option>Wednesday</option><option>Thursday</option><option>Friday</option><option>Saturday</option></select></div>
<div id="status" class="status" role="status">Loading meeting information…</div><div id="map" aria-label="Map of AA meetings"></div>
<details><summary>Unmapped meetings and source information</summary><div id="unmapped"></div><p>Sources: <a href="https://nnjaa.org/intergroup/cgi-bin/list_special.php?sortby=Time&amp;special=Young+people&amp;url=">Northern NJ</a> · <a href="https://aasj.org/locations/">South Jersey</a> · <a href="https://capeatlanticaa.org/locations/">Cape Atlantic</a>. Not affiliated with AA or these intergroups.</p></details>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
'use strict';
const map=L.map('map').setView([40.0583,-74.4057],8);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);
const layer=L.layerGroup().addTo(map);let meetings=[];let updated=null;
const valid=m=>Number.isFinite(m.lat)&&Number.isFinite(m.lon)&&m.lat>=38.7&&m.lat<=41.5&&m.lon>=-75.8&&m.lon<=-73.7;
function el(tag,cls,content){const n=document.createElement(tag);if(cls)n.className=cls;if(content!==undefined)n.textContent=String(content);return n}
function refresh(){layer.clearLayers();const q=document.getElementById('search').value.trim().toLowerCase();const day=document.getElementById('day').value;const matches=meetings.filter(m=>(!day||m.day===day)&&(!q||[m.name,m.town,m.location,m.address,m.types].join(' ').toLowerCase().includes(q)));const grouped=new Map();for(const m of matches.filter(valid)){const key=(m.address||m.location+' '+m.town).trim().toLowerCase();if(!grouped.has(key))grouped.set(key,[]);grouped.get(key).push(m)}const bounds=[];const overlapping=new Map();for(const group of grouped.values()){const first=group[0],key=first.lat.toFixed(6)+','+first.lon.toFixed(6),idx=overlapping.get(key)||0;overlapping.set(key,idx+1);const point=[first.lat+Math.sin(idx*2.39996)*idx*.00010,first.lon+Math.cos(idx*2.39996)*idx*.00010];bounds.push(point);const marker=L.marker(point,{icon:L.divIcon({className:'',html:'<div class="pin">'+group.length+'</div>',iconSize:[36,36],iconAnchor:[18,18]})});const popup=el('div');popup.append(el('strong','',first.location||first.town),el('p','',first.address));for(const m of group){const item=el('div','meeting');item.append(el('strong','',m.name),el('span','',m.day+' · '+m.time),el('small','',m.types),el('small','',m.source));popup.append(item)}const link=el('a','directions','Get Apple Maps directions');link.href='https://maps.apple.com/?daddr='+encodeURIComponent(first.address);link.target='_blank';link.rel='noopener noreferrer';popup.append(link);marker.bindPopup(popup).addTo(layer)}const date=updated?new Date(updated).toLocaleString():'not yet available';document.getElementById('status').textContent=matches.length+' meetings · '+grouped.size+' mapped locations · Updated: '+date;if(bounds.length>1)map.fitBounds(bounds,{padding:[35,35],maxZoom:11});else if(bounds.length===1)map.setView(bounds[0],13);else map.setView([40.0583,-74.4057],8)}
async function load(){try{const response=await fetch('./meetings.json',{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();if(!Array.isArray(data.meetings))throw Error('Invalid meeting data');meetings=data.meetings;updated=data.updated_at;const box=document.getElementById('unmapped');box.replaceChildren();const missing=meetings.filter(m=>!valid(m));box.append(el('p','',missing.length+' unmapped meetings'));for(const m of missing)box.append(el('p','',m.day+' '+m.time+' · '+m.name+' · '+m.address));if(!meetings.length)box.append(el('p','','No meeting snapshot has been published yet. Run the GitHub Actions updater.'));refresh()}catch(err){document.getElementById('status').textContent='Could not load meeting data: '+err.message}}
document.getElementById('search').addEventListener('input',refresh);document.getElementById('day').addEventListener('change',refresh);load();
</script></body></html>
